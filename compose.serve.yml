services:
  predictor:
    build:
      context: .
      dockerfile: Dockerfile.serve
    environment:
      MODEL_URI: ${MODEL_URI:?Set an exact registered model version}
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      MLFLOW_S3_ENDPOINT_URL: http://host.docker.internal:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/ping', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 30s
    restart: unless-stopped
